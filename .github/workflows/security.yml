name: P0 Security
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks mit festgelegter Prüfsumme ausführen
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Rust-Lockfile mit cargo-audit prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          cd "$RUNNER_TEMP/cargo-audit"
          curl --fail --silent --show-error --location --retry 3 -o cargo-audit.tgz https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  cargo-audit.tgz' | sha256sum --check
          tar -xzf cargo-audit.tgz
          ./cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit --file "$GITHUB_WORKSPACE/Cargo.lock" --db "$RUNNER_TEMP/cargo-audit/advisory-db" --deny warnings
          git -C "$RUNNER_TEMP/cargo-audit/advisory-db" rev-parse HEAD
