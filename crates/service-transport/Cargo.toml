[package]
name = "kitaconnect-service-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
mime = "=0.3.17"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["net", "io-util", "time", "macros", "sync", "rt"] }
sha2 = { version = "=0.11.1", default-features = false }
x509-parser = { version = "=0.16.0", default-features = false }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
time = "=0.3.55"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "sync"] }
