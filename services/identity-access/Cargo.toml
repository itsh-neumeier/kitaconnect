[package]
name = "kitaconnect-identity-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kitaconnect-service-transport = { path = "../../crates/service-transport" }
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
url = "=2.5.8"
totp-rs = { version = "=6.0.0", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
serde_json = "=1.0.154"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
getrandom = "=0.4.3"
sha2 = { version = "=0.11.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
time = "=0.3.55"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "time", "net", "io-util"] }
