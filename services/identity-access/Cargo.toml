[package]
name = "kitaconnect-identity-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom = "=0.4.3"
sha2 = { version = "=0.11.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }

[dev-dependencies]
tokio = { version = "=1.54.0", default-features = false, features = ["macros", "rt", "time"] }
