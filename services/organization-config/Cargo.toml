[package]
name = "kitaconnect-organization-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
mime = "=0.3.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
kitaconnect-service-transport = { path = "../../crates/service-transport" }
kitaconnect-service-oauth = { path = "../../crates/service-oauth" }
base64 = "=0.22.1"
url = "=2.5.8"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "net", "time"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "time"] }
